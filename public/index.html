<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Claude Web Terminal</title>
  <link rel="stylesheet" href="/vendor/xterm.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header id="bar">
    <span class="brand">◎ claude<span>·web·terminal</span></span>
    <div id="tabs"></div>
    <button id="add" title="新建窗口">＋</button>
    <div class="spacer"></div>
    <span id="status" class="status"></span>
    <button id="logins" title="登录记录">🛡</button>
    <button id="logout" title="退出登录">⏻</button>
  </header>

  <main id="stage"></main>

  <!-- on-screen keys for mobile soft keyboards (no arrows/Esc/Tab/Ctrl) -->
  <div id="keybar">
    <button data-key="esc">Esc</button>
    <button data-key="tab">Tab</button>
    <button data-key="stab">⇧Tab</button>
    <button data-key="ctrl" id="kCtrl" title="Ctrl（按一下，再按字母）">Ctrl</button>
    <button data-key="ctrlc">^C</button>
    <button data-key="up">↑</button>
    <button data-key="down">↓</button>
    <button data-key="left">←</button>
    <button data-key="right">→</button>
    <button data-key="enter" class="wide">⏎</button>
    <button data-key="kbd" id="kKbd" title="弹出/收起键盘">⌨</button>
  </div>

  <!-- create-window dialog -->
  <dialog id="newDlg">
    <form method="dialog">
      <h3>新建窗口</h3>
      <label>名称 <input name="name" placeholder="window" autocomplete="off" /></label>
      <label>工作目录
        <input name="cwd" list="dirlist" placeholder="~ (默认 home)" autocomplete="off" />
        <datalist id="dirlist"></datalist>
      </label>
      <div id="dirchips" class="chips"></div>
      <label>启动命令 <input name="command" value="claude" autocomplete="off" /></label>
      <p class="hint">留空命令则只开一个交互 shell。会话由 tmux 托管，刷新/重启后可重连。</p>
      <menu>
        <button value="cancel">取消</button>
        <button value="ok" id="newOk">创建</button>
      </menu>
    </form>
  </dialog>

  <!-- login overlay -->
  <div id="login" hidden>
    <form id="loginForm">
      <h2>◎ Claude Web Terminal</h2>
      <input name="user" placeholder="用户名" autocomplete="username" />
      <input name="pass" type="password" placeholder="密码" autocomplete="current-password" />
      <input name="code" id="totpField" inputmode="numeric" autocomplete="one-time-code"
             placeholder="6 位验证码" maxlength="6" hidden />
      <button type="submit">登录</button>
      <p id="loginErr" class="err"></p>
    </form>
  </div>

  <!-- login history -->
  <dialog id="loginsDlg">
    <h3>登录记录（近 50 条）</h3>
    <div id="loginsList" class="logins"></div>
    <menu><button value="ok" autofocus>关闭</button></menu>
  </dialog>

  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/app.js"></script>
</body>
</html>
