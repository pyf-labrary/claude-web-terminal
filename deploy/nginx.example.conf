# Reverse proxy + TLS termination + WebSocket upgrade.
# /etc/nginx/sites-available/tty.example.com  (symlink into sites-enabled)

# Throttle login attempts (defense in depth; the app also locks out per IP).
limit_req_zone $binary_remote_addr zone=tty_login:10m rate=10r/m;

server {
    listen 80;
    server_name tty.example.com;
    # ACME HTTP-01 webroot (acme.sh --issue -w /var/www/html ...)
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name tty.example.com;

    ssl_certificate     /etc/nginx/ssl/tty.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/tty.example.com/key.pem;

    # rate-limited login endpoint
    location = /api/login {
        limit_req zone=tty_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:7531;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # real client IP -> audit log
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:7531;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;       # WebSocket
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;   # so cookies get Secure
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;                    # long-lived terminals
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
}
